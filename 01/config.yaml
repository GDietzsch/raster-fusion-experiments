# Primeiro experimento enriquecido: regressão linear simples.
# Os limites de amostragem mantêm a escala do piloto temporal anterior.
data_root: ../data/conjuntos_enriquecidos/20260925T122022935585Z
output_root: ../runs/enriched_linear
reference_target: treinamento/2020/targets/target.tif
split:
  method: spatial_block
  train: 0.70
  validation: 0.15
  test: 0.15
  block_size: 96
  buffer_pixels: 3
  seed: 42
sampling:
  per_stage_year: 100000
  seed: 4201
  window_size: 512
evaluation:
  target_resampling: nearest
  high_target_positive_quantile: 0.99
  primary_metric: rmse
  tie_breakers: [mae, fewer_features]
  final_h0_target_years: [2020, 2021, 2022]
  final_h1_target_years: [2022]
runtime:
  cpu_threads: 4
