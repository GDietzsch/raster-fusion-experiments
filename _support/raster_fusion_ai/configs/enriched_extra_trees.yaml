  final_trees: 320
  max_features: [0.50, 0.75, 1.00]
  min_samples_leaf: [0.0005, 0.002, 0.01]
  max_leaf_nodes: [256, 1024, 4096]
  min_samples_split: [0.001, 0.005, 0.02]
  reference_candidate:
    max_features: 0.75
    min_samples_leaf: 0.002
    max_leaf_nodes: 1024
    min_samples_split: 0.005
runtime:
  cpu_threads: 4
