[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raster-fusion-ai"
version = "0.1.0"
requires-python = ">=3.11"
description = "Reproducible spatial raster regression experiments"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
